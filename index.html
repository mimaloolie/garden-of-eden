<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden of Eden</title>
    <style>
        :root {
            --bg-pastel-blue: #EBF5FB;
            --card-bg: #FFFFFF;
            --card-hover: #F8FCFF;
            --text-black: #111111;
            --text-muted: #444444;
            --border-color: #5D8AA8; /* Muted Slate-Teal Border */
            --accent-tint: #D6EAF8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-pastel-blue);
            color: var(--text-black);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
        }

        /* Header */
        header {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 40px auto;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 1px;
            font-weight: 700;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        /* Grid Layout for Compact Cards */
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Compact Card Styling */
        .oc-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            flex-direction: column;
        }

        .oc-card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            box-shadow: 0 6px 14px rgba(93, 138, 168, 0.25);
        }

        .card-img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background-color: var(--accent-tint);
            border-bottom: 2px solid var(--border-color);
        }

        .card-compact-body {
            padding: 18px;
        }

        .card-compact-body h2 {
            font-size: 1.35rem;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .card-basic-list {
            list-style: none;
            font-size: 0.9rem;
        }

        .card-basic-list li {
            margin-bottom: 3px;
        }

        .click-hint {
            margin-top: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: underline;
            color: var(--text-black);
        }

        /* Expanded Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(17, 17, 17, 0.55);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        /* Expanded Card */
        .modal-card {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 10px;
            max-width: 750px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .close-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            background: var(--bg-pastel-blue);
            border: 2px solid var(--border-color);
            color: var(--text-black);
            font-size: 1.1rem;
            font-weight: bold;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            cursor: pointer;
        }

        .close-btn:hover {
            background-color: var(--accent-tint);
        }

        .modal-header {
            display: flex;
            gap: 24px;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .modal-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background-color: var(--accent-tint);
            flex-shrink: 0;
        }

        .modal-title-area h2 {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .modal-section {
            margin-bottom: 22px;
        }

        .modal-section h3 {
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            margin-bottom: 10px;
        }

        .modal-section p {
            font-size: 0.95rem;
            white-space: pre-line;
        }

        /* AI Prompt Box */
        .prompt-box {
            background-color: var(--bg-pastel-blue);
            border: 1.5px solid var(--border-color);
            border-radius: 6px;
            padding: 14px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
            word-break: break-word;
            margin-bottom: 10px;
        }

        .copy-btn {
            background-color: var(--card-bg);
            color: var(--text-black);
            border: 2px solid var(--border-color);
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
        }

        .copy-btn:hover {
            background-color: var(--bg-pastel-blue);
        }

        @media (max-width: 600px) {
            .modal-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
